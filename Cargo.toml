[package]
name = "instagrep"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Fast grep-style search using a persisted roaring-bitmap trigram index"
repository = "https://github.com/kevdodo/instagrep"

[dependencies]
regex = "1"
regex-syntax = "0.8"
rayon = "1"
roaring = "0.11"
rustc-hash = "2"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
